<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="/assets/css/mobile.style.css">
  <link rel="stylesheet" media="screen and  (min-width:375px)" href="/assets/css/tablet.style.css">
  <link rel="stylesheet" media="screen and  (min-width:800px)" href="/assets/css/desktop.style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <script src="/assets/js/logic.js"></script>
  <title>Frontend Mentor | Product list with cart</title>

<body>
  <section class="container">
    <section class="products">
      <section class="title-wrapper">
        <h1 class="title">
          Desserts
        </h1>
      </section>
      <section class="product-list">
        <div class="item">
          <img class="product-img" src="/assets/images/image-waffle-mobile.jpg" alt="">
          <span class="button-wrapper">
            <img src="/assets/images/icon-add-to-cart.svg"/>
            Add to Cart
          </span>
          <span class="description">
            <p class="product-category">Waffle</p>
            <p class="product-name">Waffle with Berries</p>
            <p class="product-price">$6.50</p>
          </span>
        </div>
        <div class="item">
          <img class="product-img" src="/assets/images/image-waffle-mobile.jpg" alt="">
          <span class="button-wrapper">
            <img src="/assets/images/icon-add-to-cart.svg"/>
            Add to Cart
          </span>
          <span class="description">
            <p class="product-category">Waffle</p>
            <p class="product-name">Waffle with Berries</p>
            <p class="product-price">$6.50</p>
          </span>
        </div>
        <div class="item">
          <img class="product-img" src="/assets/images/image-waffle-mobile.jpg" alt="">
          <span class="button-wrapper">
            <img src="/assets/images/icon-add-to-cart.svg"/>
            Add to Cart
          </span>
          <span class="description">
            <p class="product-category">Waffle</p>
            <p class="product-name">Waffle with Berries</p>
            <p class="product-price">$6.50</p>
          </span>
        </div>
      </section>
    </section>

    <section class="cart">
      <p>Your Cart (0)</p>
      <section class="cart__empty">
        <img src="/assets/images/illustration-empty-cart.svg" alt="">
        <span>Your added items will appear here</span>
      </section>
