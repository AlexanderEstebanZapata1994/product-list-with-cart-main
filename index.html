<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="/assets/css/mobile.style.css">
  <link rel="stylesheet" media="screen and  (min-width:375px)" href="/assets/css/tablet.style.css">
  <link rel="stylesheet" media="screen and  (min-width:800px)" href="/assets/css/desktop.style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
  <script src="/assets/js/logic.js"></script>
  <title>Frontend Mentor | Product list with cart</title>
</head>
<body>
  <section class="container">
    <span>
      <h2>Desserts</h2>
    </span>
    <section class="product-list">
      <div class="item">
        <img src="/assets/images/image-waffle-mobile.jpg" alt="">
        <span class="button">
          <i></i>
          Add to Cart
        </span>
        <p class="category">Waffle</p>
        <p class="description">Waffle with Berries</p>
        <span class="price">$6.50</span>
      </div>
    </section>

    <section class="cart">
      <h1>Your Cart (0)</h1>
      <section class="cart__empty">
        <img src="/assets/images/illustration-empty-cart.svg" alt="">
        <span>Your added items will appear here</span>
      </section>
      <section class="cart__full">
        <p>Classic Tiramisu</p>
        <span class="qty">1x</span>
        <span class="unit-price">$5.50</span>
        <span class="total-price">$5.50</span>
        <span class="remove"><i></i></span>
        <hr/>
        <div>
          <p>Order Total</p>
          <h2 class="gran-total">$46.50</h2>
        </div>
        <section><i></i>This is a <strong>carbon-neutral</strong> delivery</section>
        <button>Confirm Order</button>
      </section>
    </section>
  </section>
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Alexander Esteban Zapata</a>.
  </div>
</body>
</html>
