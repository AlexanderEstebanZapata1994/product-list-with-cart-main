<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="/assets/css/mobile.style.css">
  <link rel="stylesheet" media="screen and  (min-width:375px)" href="/assets/css/tablet.style.css">
  <link rel="stylesheet" media="screen and  (min-width:800px)" href="/assets/css/desktop.style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
  <script src="/assets/js/logic.js"></script>
  <title>Frontend Mentor | Product list with cart</title>
</head>
<body>
  <section class="container">
    <section class="products">
      <section class="title-wrapper">
        <h1 class="title">
          Desserts
        </h1>
      </section>
      <section class="product-list">
        <div class="item">
          <img class="product-img product-img__selected" src="/assets/images/image-waffle-mobile.jpg" alt="">
          <span class="button-wrapper button-wrapper__selected">
            <svg xmlns="http://www.w3.org/2000/svg" width="10" height="2" fill="none" viewBox="0 0 10 2"><path fill="#fff" d="M0 .375h10v1.25H0V.375Z"/></svg>
            4
            <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" fill="none" viewBox="0 0 10 10"><path fill="#fff" d="M10 4.375H5.625V0h-1.25v4.375H0v1.25h4.375V10h1.25V5.625H10v-1.25Z"/></svg>
          </span>
          <span class="description">
            <p class="product-category">Waffle</p>
            <p class="product-name">Waffle with Berries</p>
            <p class="product-price">$6.50</p>
          </span>
        </div>
        <div class="item">
          <img class="product-img" src="/assets/images/image-brownie-mobile.jpg" alt="">
          <span class="button-wrapper">
            <img src="/assets/images/icon-add-to-cart.svg"/>
            Add to Cart
          </span>
          <span class="description">
            <p class="product-category">Cake</p>
            <p class="product-name">Classic Tiramisu</p>
            <p class="product-price">$7.50</p>
          </span>
        </div>
      </section>
    </section>

    <section class="cart">
      <p>Your Cart (1)</p>
      <!-- <section class="cart__empty">
        <img src="/assets/images/illustration-empty-cart.svg" alt="">
        <span>Your added items will appear here</span>
      </section> -->
      <section class="cart__full">
        <ul>
          <li>
            <div class="details">
              <span class="product-name">Waffle with Berries</span>
              <section class="values-details">
                <span class="qty value-detail">4x</span>
                <span class="unit-price prices value-detail">@ $6.50</span>
                <span class="total-price prices value-detail"><strong>$26.00</strong></span>
              </section>
            </div>
            <span class="remove-button"><img src="/assets/images/icon-remove-item.svg" alt="remove item icon"></span>
          </li>
        </ul>
        <div class="grand-total">
          <span>Order Total</span>
          <h2 class="total-delivery">$26.00</h2>
        </div>
        <section class="disclaimer">
            <img src="/assets/images/icon-carbon-neutral.svg" alt="image-carbon neutral">&nbsp;This is a&nbsp;<strong>carbon-neutral</strong>&nbsp;delivery</section>
        <button class="button-confirmation">Confirm Order</button>
      </section>
    </section>
    <br>
    <div class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
      Coded by <a href="#">Alexander Esteban</a>.
    </div>
  </section>
</body>
</html>
